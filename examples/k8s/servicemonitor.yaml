# For the Prometheus Operator (kube-prometheus-stack and similar). Your
# Prometheus resource selects ServiceMonitors by label; kube-prometheus-stack
# installs by default select `release: <helm release name>`. Adjust the label
# below to match yours.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: watchfor-prometheus-exporter
  labels:
    app.kubernetes.io/name: watchfor-prometheus-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: watchfor-prometheus-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
