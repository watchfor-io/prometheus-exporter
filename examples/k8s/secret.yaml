# One key per organization. Create it from the command line instead of
# committing this file with a real key:
#
#   kubectl create secret generic watchfor-api-keys \
#     --from-literal=acme=wf_live_... --from-literal=acme-staging=wf_live_...
#
# The exporter re-reads the key files on every poll, so rotating a key is a
# `kubectl apply` of the new Secret; the kubelet updates the mounted files
# within a minute or two and no restart is needed.
apiVersion: v1
kind: Secret
metadata:
  name: watchfor-api-keys
  labels:
    app.kubernetes.io/name: watchfor-prometheus-exporter
type: Opaque
stringData:
  acme: wf_live_replace_me
