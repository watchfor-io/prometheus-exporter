# Loads every dashboard in ../dashboards (mounted at /etc/grafana/dashboards/watchfor)
# into a "WatchFor" folder. Grafana re-reads the directory every 30 s.
#
# The dashboard's "Data source" variable falls back to a Prometheus data source when
# loaded from a file. With several Prometheus data sources Grafana picks the first by
# name; pick the right one in the dropdown, or replace ${DS_PROMETHEUS} in the JSON
# with your data source uid before provisioning.
apiVersion: 1
providers:
  - name: watchfor
    folder: WatchFor
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/watchfor
      foldersFromFilesStructure: false
