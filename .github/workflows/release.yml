name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # A second pair of hands: the release environment waits for a
    # reviewer's approval before anything is published.
    environment: release
    permissions:
      contents: write # the release and its assets
      id-token: write # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every published archive, verifiable with
      # `gh attestation verify <file> --repo watchfor-io/prometheus-exporter`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  image:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/watchfor-io/prometheus-exporter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/watchfor-io/prometheus-exporter
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The release is rebuilt from the tag, on a fresh runner, with the same
  # toolchain and flags, and the binaries must match byte for byte.
  reproduce:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rebuild and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"; ver="${tag#v}"
          # Go stamps vcs.modified into the binary from `git status`, so a
          # single stray file in the tree changes the bytes. Everything this
          # job writes goes outside the checkout, and every binary is built
          # before anything is downloaded.
          out="$RUNNER_TEMP/reproduce"; mkdir -p "$out"
          if [ -n "$(git status --porcelain)" ]; then
            echo "the checkout is not clean; a rebuild from it cannot match:"; git status --porcelain; exit 1
          fi
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.Version=$ver" -o "$out/rebuilt-$os-$arch" ./cmd/watchfor-prometheus-exporter
          done
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "watchfor-prometheus-exporter_${ver}_${os}_${arch}.tar.gz" --output "$out/release.tar.gz" --clobber
            tar -xzf "$out/release.tar.gz" -C "$out" watchfor-prometheus-exporter
            if cmp -s "$out/watchfor-prometheus-exporter" "$out/rebuilt-$os-$arch"; then
              echo "$os/$arch: the published binary reproduces ($(sha256sum < "$out/watchfor-prometheus-exporter" | cut -c1-16)…)"
            else
              echo "$os/$arch: the published binary does NOT reproduce"; exit 1
            fi
            rm -f "$out/watchfor-prometheus-exporter"
          done
